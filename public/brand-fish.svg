<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8ec5ff"/>
      <stop offset="55%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfe7ff"/>
      <stop offset="100%" stop-color="#a8c7ff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer soft ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="white" stroke-opacity="0.18" stroke-width="3"/>

  <!-- fish body -->
  <g transform="translate(24,40)">
    <ellipse cx="40" cy="24" rx="22" ry="14" fill="url(#bg)" />
    <!-- tail -->
    <polygon points="54,24 70,36 70,12" fill="#2b6bf6" />
    <!-- eye -->
    <circle cx="30" cy="22" r="3.5" fill="#ff3b3b" />
    <!-- highlight bubble -->
    <circle cx="18" cy="16" r="4" fill="#9dd6ff" opacity="0.7" />
  </g>
</svg>